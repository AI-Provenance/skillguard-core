[project]
name = "skillguard-core"
version = "0.1.10"
description = "Security scanner for AI agent skills — engines, fusion, CLI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Shahriyar Rzayev", email = "rzayev.sehriyar@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
ai = [
    "deepagents==0.7.5",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langsmith>=0.3.0",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-deepseek",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/AI-Provenance/skillguard-core"
Repository = "https://github.com/AI-Provenance/skillguard-core"
Issues = "https://github.com/AI-Provenance/skillguard-core/issues"

[project.scripts]
skillguard = "skillguard_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillguard_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real scanner binaries installed"]

[tool.ruff]
line-length = 100
target-version = "py312"
