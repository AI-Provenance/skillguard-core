name: "SkillGuard Scan"
description: "Scan AI agent skills for security risks"
branding:
  icon: shield
  color: red
inputs:
  path:
    description: "Skill directory to scan"
    required: false
    default: "."
  fail-on:
    description: "Fail threshold: caution or dangerous"
    required: false
    default: "dangerous"
  workers:
    description: "Number of parallel scan workers (default: CPU count)"
    required: false
    default: ""
  use-llm:
    description: "Enable LLM review of caution/dangerous verdicts (bring your own key via env)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install skillguard
      run: |
        if [ "${{ inputs.use-llm }}" = "true" ]; then
          pipx install "${{ github.action_path }}[ai]"
        else
          pipx install "${{ github.action_path }}"
        fi
      shell: bash
    - name: Scan
      id: scan
      run: |
        set +e
        WORKERS_FLAG=""
        if [ -n "${{ inputs.workers }}" ]; then WORKERS_FLAG="--workers ${{ inputs.workers }}"; fi
        USE_LLM_FLAG=""
        if [ "${{ inputs.use-llm }}" = "true" ]; then USE_LLM_FLAG="--use-llm"; fi
        skillguard scan "${{ inputs.path }}" --sarif $WORKERS_FLAG $USE_LLM_FLAG > "${{ github.workspace }}/skillguard.sarif"
        code=$?
        set -e
        case "$code" in
          0) verdict="safe" ;;
          1) verdict="caution" ;;
          2) verdict="dangerous" ;;
          3) verdict="inconclusive" ;;
          *) verdict="unknown" ;;
        esac
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.fail-on }}" = "caution" ] && [ "$code" -ge 1 ]; then
          echo "::error::skillguard scan failed: worst verdict '$verdict' (exit code $code) meets fail-on threshold 'caution'. See the step log above for per-skill results and the skillguard-sarif artifact for details."
          exit 1
        fi
        if [ "${{ inputs.fail-on }}" = "dangerous" ] && [ "$code" -ge 2 ]; then
          echo "::error::skillguard scan failed: worst verdict '$verdict' (exit code $code) meets fail-on threshold 'dangerous'. See the step log above for per-skill results and the skillguard-sarif artifact for details."
          exit 1
        fi
        exit 0
      shell: bash
    - name: Upload SARIF
      id: upload-sarif
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: skillguard-sarif
        path: skillguard.sarif
        if-no-files-found: ignore
